<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1322"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c37"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="blurGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glowing background light orbs -->
  <circle cx="850" cy="280" r="220" fill="rgba(255, 107, 26, 0.15)" filter="url(#blurGlow)"/>
  <circle cx="250" cy="450" r="180" fill="rgba(59, 130, 246, 0.08)" filter="url(#blurGlow)"/>

  <!-- Left Column: Branding and Headline -->
  <!-- Top Category Chip -->
  <rect x="90" y="80" width="220" height="42" rx="21" fill="rgba(255,107,26,0.18)" stroke="rgba(255,107,26,0.4)" stroke-width="1.5"/>
  <circle cx="112" cy="101" r="6" fill="#ff6b1a"/>
  <text x="128" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffedd5" letter-spacing="1">LIVE 3D SKYSCRAPER</text>

  <!-- Main Headline -->
  <text x="90" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    GeTopFloor
  </text>
  <text x="90" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ff7a29">
    Claim the Top Floor.
  </text>

  <!-- Description -->
  <text x="90" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    Put your company on top of the internet's
  </text>
  <text x="90" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">
    tallest interactive tower. Outbid competitors &amp; get noticed.
  </text>

  <!-- Metrics Bar -->
  <g transform="translate(90, 430)">
    <rect width="520" height="88" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Metric 1 -->
    <text x="32" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">50 Floors</text>
    <text x="32" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b">CAPACITY</text>
    
    <line x1="180" y1="20" x2="180" y2="68" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Metric 2 -->
    <text x="210" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#22c55e">Instant</text>
    <text x="210" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b">OUTBID PLACEMENT</text>

    <line x1="370" y1="20" x2="370" y2="68" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Metric 3 -->
    <text x="400" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#fbbf24">127+</text>
    <text x="400" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748b">COUNTRIES</text>
  </g>

  <!-- Right Column: 3D Skyscraper Silhouette Art -->
  <g transform="translate(740, 70)">
    <!-- Base Slabs -->
    <rect x="60" y="380" width="280" height="56" rx="10" fill="#131d2e" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <text x="200" y="415" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">BASE PLAZA #50</text>

    <rect x="80" y="305" width="240" height="56" rx="10" fill="#182338" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <text x="200" y="340" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle">EXECUTIVE LEVEL #2</text>

    <!-- Top Floor (Golden Highlighted) -->
    <rect x="70" y="210" width="260" height="74" rx="14" fill="url(#glow)" filter="url(#blurGlow)"/>
    <rect x="70" y="210" width="260" height="74" rx="14" fill="url(#glow)" stroke="#ffedd5" stroke-width="2.5"/>
    <text x="200" y="248" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">★ PENTHOUSE FLOOR #1</text>
    <text x="200" y="270" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffedd5" text-anchor="middle">TOP ATTENTION SPOT</text>

    <!-- Rooftop Billboard -->
    <rect x="90" y="110" width="220" height="70" rx="8" fill="#ffffff" stroke="#ff6b1a" stroke-width="4"/>
    <text x="200" y="153" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#000000" text-anchor="middle">GeTopFloor</text>

    <!-- Antenna & Beacon -->
    <line x1="200" y1="110" x2="200" y2="40" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
    <circle cx="200" cy="35" r="10" fill="#fbbf24" filter="url(#blurGlow)"/>
    <circle cx="200" cy="35" r="5" fill="#ffffff"/>
  </g>

  <!-- URL Footer -->
  <text x="90" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#64748b">
    getopfloor.com
  </text>
</svg>
